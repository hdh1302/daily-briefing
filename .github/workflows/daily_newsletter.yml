name: Daily Finance & Marketing Briefing

on:
  schedule:
    # Chạy vào lúc 02:00 UTC mỗi ngày = 09:00 sáng Giờ Việt Nam (UTC+7)
    - cron: '0 2 * * *'
  workflow_dispatch: # Cho phép kích hoạt thủ công bằng nút "Run workflow" trên GitHub

jobs:
  build-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt môi trường Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cài đặt các thư viện phụ thuộc
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Chạy script tổng hợp tin tức và gửi Email
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python daily_briefing.py
